services:
  db:
    # EC2 한 대에서 운영하는 개발 서버용 PostgreSQL + pgvector 컨테이너.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # DB는 외부에 열지 않고 EC2 내부에서만 접근한다.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # 지원 종료 전 필요한 데이터는 반드시 별도 백업해야 한다.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # rolling summary/event 처리용 Redis. 외부 공개가 필요 없으므로 localhost에만 바인딩한다.
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    # Spring Boot API 서버. EC2에서는 8000번 포트로 접근한다.
    build:
      context: .
      dockerfile: Dockerfile
    image: int1-project-team02-app:latest
    restart: unless-stopped
    env_file:
      # 서버에서 직접 생성한다. Git에는 올리지 않는다.
      - path: .env.prod
        required: false
    environment:
      # 컨테이너 네트워크 안에서는 서비스명(db, redis)으로 접근한다.
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${APP_PORT:-8000}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  discord-bot:
    # 같은 이미지에서 별도 main class를 실행해 Discord 봇 프로세스를 분리한다.
    image: int1-project-team02-app:latest
    restart: unless-stopped
    env_file:
      # DISCORD_TOKEN, OPENAI_API_KEY, INTERNAL_API_KEY 등은 이 파일에서 주입한다.
      - path: .env.prod
        required: false
    environment:
      # 봇은 호스트 포트가 아니라 Compose 내부 네트워크로 API 서버를 호출한다.
      INTERNAL_API_BASE_URL: http://app:8080
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    entrypoint:
      # Spring Boot 서버가 아니라 DiscordBotMain을 직접 실행한다.
      - java
      - --enable-native-access=ALL-UNNAMED
      - -XX:+UseSerialGC
      - -XX:MaxRAMPercentage=55
      - -XX:+ExitOnOutOfMemoryError
      - -cp
      - BOOT-INF/classes:BOOT-INF/lib/*
      - com.flodiback.bot.DiscordBotMain
    depends_on:
      app:
        condition: service_started

volumes:
  # Docker named volume이므로 컨테이너 재생성 시에도 데이터가 유지된다.
  postgres_data:
  redis_data:
