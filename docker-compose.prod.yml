# docker-compose.prod.yml은 EC2에서 운영 환경을 위한 설정 파일이다.
# NPM(Nginx Proxy Manager)이 외부 80/443을 담당하고, 내부 nginx가 blue-green 업스트림을 스위칭한다.
# DB와 Redis는 외부에 노출하지 않고 localhost 바인딩으로 보안을 강화한다.
# Discord 봇은 별도 프로세스로 분리하여 운영하며, 필요한 환경 변수는 .env.prod에서 주입한다.
x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  image: int1-project-team02-app:latest
  restart: unless-stopped
  env_file:
    # 서버에서 직접 생성한다. Git에는 올리지 않는다.
    - path: .env.prod
      required: false
  environment:
    # 컨테이너 네트워크 안에서는 서비스명(db, redis)으로 접근한다.
    SPRING_PROFILES_ACTIVE: prod
    DB_HOST: db
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    # EC2 한 대에서 운영하는 개발 서버용 PostgreSQL + pgvector 컨테이너.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # DB는 외부에 열지 않고 EC2 내부에서만 접근한다.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # 지원 종료 전 필요한 데이터는 반드시 별도 백업해야 한다.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # rolling summary/event 처리용 Redis. 외부 공개가 필요 없으므로 localhost에만 바인딩한다.
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  npm:
    # Nginx Proxy Manager: 외부 80/443 트래픽을 받아 HTTPS 인증서를 자동 발급/갱신하고
    # 내부 nginx로 프록시한다. 관리 UI는 81 포트에서 접근한다.
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"
    volumes:
      - npm_data:/data
    depends_on:
      nginx:
        condition: service_healthy

  nginx:
    # NPM에서 넘어온 트래픽을 active app 슬롯(blue/green)으로 프록시한다.
    # SSL은 NPM이 처리하므로 nginx는 내부 HTTP 프록시 역할만 한다.
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app-blue:
    <<: *app-common

  app-green:
    <<: *app-common
    # 기본 docker compose up에서는 green 슬롯을 띄우지 않는다.
    # 배포 스크립트가 --profile green으로 필요한 순간에만 제어한다.
    profiles:
      - green

  discord-bot:
    # 같은 이미지에서 별도 main class를 실행해 Discord 봇 프로세스를 분리한다.
    # Discord 토큰 중복 연결을 피하기 위해 blue/green 대상에서 제외하고 항상 단일 프로세스로만 실행한다.
    image: int1-project-team02-app:latest
    restart: unless-stopped
    env_file:
      # DISCORD_TOKEN, OPENAI_API_KEY, INTERNAL_API_KEY 등은 이 파일에서 주입한다.
      - path: .env.prod
        required: false
    environment:
      # 봇은 nginx를 통해 현재 active API 슬롯을 호출한다.
      INTERNAL_API_BASE_URL: http://nginx:80
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    entrypoint:
      # Spring Boot 서버가 아니라 DiscordBotMain을 직접 실행한다.
      - java
      - --enable-native-access=ALL-UNNAMED
      - -XX:+UseSerialGC
      - -XX:MaxRAMPercentage=55
      - -XX:+ExitOnOutOfMemoryError
      - -cp
      - BOOT-INF/classes:BOOT-INF/lib/*
      - com.flodiback.bot.DiscordBotMain
    depends_on:
      - nginx

volumes:
  # Docker named volume이므로 컨테이너 재생성 시에도 데이터가 유지된다.
  postgres_data:
  redis_data:
  npm_data:
