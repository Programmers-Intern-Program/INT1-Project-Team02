spring:
  datasource:
    # 운영 컨테이너에서는 docker-compose.prod.yml의 db 서비스명과 .env.prod 값을 조합한다.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?reWriteBatchedInserts=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      # Redis도 Compose 내부 서비스명(redis)으로 접근한다.
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  jpa:
    # 운영에서는 Flyway migration 결과와 엔티티 매핑이 맞는지만 검증한다.
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        highlight_sql: false
        use_sql_comments: false
        default_batch_fetch_size: 100

  batch:
    jdbc:
      # 운영 DB 스키마는 Flyway 기준으로 관리한다.
      initialize-schema: never

logging:
  level:
    # 운영 로그에서 SQL 바인딩/트랜잭션 trace가 과도하게 쌓이지 않게 낮춘다.
    root: INFO
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.jdbc.extract: WARN
    org.springframework.transaction.interceptor: WARN
    org.springframework.security: WARN
    com.flodiback: INFO

management:
  endpoints:
    web:
      exposure:
        # EC2/Compose 헬스체크 확인용 최소 endpoint만 노출한다.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
