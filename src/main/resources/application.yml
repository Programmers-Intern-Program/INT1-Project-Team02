spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: back
  profiles:
    active: dev
  output:
    ansi:
      enabled: always
  datasource:
    hikari:
      auto-commit: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  jackson:
    serialization:
      fail-on-empty-beans: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

internal:
  api-key: ${INTERNAL_API_KEY:}

discord:
  oauth:
    client-id: ${DISCORD_CLIENT_ID}
    client-secret: ${DISCORD_CLIENT_SECRET}
    redirect-uri: ${DISCORD_REDIRECT_URI}

jwt:
  secret: ${JWT_SECRET}
  expire-hours: ${JWT_EXPIRE_HOURS:24}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

ai:
  provider: ${AI_PROVIDER:}

openai:
  api-key: ${OPENAI_API_KEY}
  chat:
    model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_CHAT_BASE_URL:https://api.openai.com/v1}
    timeout-ms: ${OPENAI_CHAT_TIMEOUT_MS:30000}
    max-retries: ${OPENAI_CHAT_MAX_RETRIES:0}
  embedding:
    api-key: ${OPENAI_EMBEDDING_API_KEY:}
glm:
  enabled: ${GLM_ENABLED:false}
  api:
    key: ${GLM_API_KEY:}
    model: ${GLM_MODEL:glm-5.1}
    url: ${GLM_API_URL:https://api.z.ai/api}
    timeout-ms: ${GLM_TIMEOUT_MS:30000}
    max-retries: ${GLM_MAX_RETRIES:0}

springdoc:
  default-produces-media-type: application/json;charset=UTF-8
