name: Release Please

on:
  push:
    branches: [ dev ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR 제목 정규화 (release-please 전처리)
        # [fix]: / [feat] 등 대괄호 형식 → fix: / feat: 형식으로 변환
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="${LAST_TAG:+${LAST_TAG}..}HEAD"

          git log "$RANGE" --pretty=format:"%s" --merges | while IFS= read -r msg; do
            PR_NUM=$(echo "$msg" | grep -oE '#[0-9]+' | head -1 | tr -d '#')
            [ -z "$PR_NUM" ] && continue

            TITLE=$(gh pr view "$PR_NUM" --json title -q '.title' 2>/dev/null || true)
            [ -z "$TITLE" ] && continue

            # [fix]: desc  → fix: desc
            # [fix] desc   → fix: desc
            # [feat]: desc → feat: desc
            NORMALIZED=$(echo "$TITLE" | sed -E \
              -e 's/^\[([a-zA-Z]+)\]: /\1: /' \
              -e 's/^\[([a-zA-Z]+)\] /\1: /' \
              -e 's/^\[([a-zA-Z]+)\]$/\1:/')

            if [ "$TITLE" != "$NORMALIZED" ]; then
              echo "정규화: #${PR_NUM} '$TITLE' → '$NORMALIZED'"
              gh pr edit "$PR_NUM" --title "$NORMALIZED"
            fi
          done

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: dev

      - name: Discord 알림 (릴리즈 생성)
        if: ${{ steps.release.outputs.release_created }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"릴리즈 생성 🏷️\",\"description\":\"**버전**: ${{ steps.release.outputs.tag_name }}\\n**커밋**: ${{ github.sha }}\",\"color\":3066993}]}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
