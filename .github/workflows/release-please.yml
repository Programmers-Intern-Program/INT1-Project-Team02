name: Release Please

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: RELEASE_PLEASE_TOKEN 확인
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN secret이 필요합니다. repo/org Actions 설정상 GITHUB_TOKEN으로 release PR을 만들 수 없습니다."
            exit 1
          fi

      - name: PR 제목 정규화 (release-please 전처리)
        # [fix]: / [feat] 등 대괄호 형식 → fix: / feat: 형식으로 변환
        # merge/squash/rebase 병합 방식 모두 커버하기 위해 GitHub API 사용
        # release PR 생성만 PAT가 필요하고, 기존 PR 제목 정규화는 GITHUB_TOKEN으로 처리한다.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            SINCE_DATE="1970-01-01T00:00:00Z"
          else
            SINCE_DATE=$(git log -1 --format="%aI" "$LAST_TAG")
          fi

          echo "마지막 태그: ${LAST_TAG:-없음}, 기준 날짜: $SINCE_DATE"

          # 병합 방식(merge/squash/rebase)에 무관하게 merged PR 목록 조회
          gh pr list --state merged --json number,title,mergedAt --limit 200 \
            | jq -r --arg since "$SINCE_DATE" \
                '.[] | select(.mergedAt > $since) | "\(.number) \(.title)"' \
          | while IFS=' ' read -r PR_NUM TITLE; do
            [ -z "$PR_NUM" ] && continue

            # [fix]: desc  → fix: desc
            # [fix]:desc   → fix: desc  (공백 없는 경우)
            # [fix] desc   → fix: desc
            # [feat]: desc → feat: desc
            # feat desc    → feat: desc (대괄호 없이 콜론만 없는 경우)
            NORMALIZED=$(echo "$TITLE" | sed -E \
              -e 's/^\[([a-zA-Z]+)\]:([^ ])/\1: \2/' \
              -e 's/^\[([a-zA-Z]+)\]: /\1: /' \
              -e 's/^\[([a-zA-Z]+)\] /\1: /' \
              -e 's/^\[([a-zA-Z]+)\]$/\1:/')

            if [ "$TITLE" != "$NORMALIZED" ]; then
              echo "정규화: #${PR_NUM} '$TITLE' → '$NORMALIZED'"
              gh pr edit "$PR_NUM" --title "$NORMALIZED"
            fi
          done

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: dev

      - name: Discord 알림 (릴리즈 생성)
        if: ${{ steps.release.outputs.release_created }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"릴리즈 생성 🏷️\",\"description\":\"**버전**: ${{ steps.release.outputs.tag_name }}\\n**커밋**: ${{ github.sha }}\",\"color\":3066993}]}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
