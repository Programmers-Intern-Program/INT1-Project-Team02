name: Tag Release

on:
  push:
    branches: [ dev ]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build.gradle.kts에서 버전 추출
        id: version
        run: |
          VERSION=$(grep '^version\s*=' build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: 태그가 이미 존재하는지 확인
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 태그 생성 및 푸시
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Discord 알림
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"릴리즈 태그 생성 🏷️\",\"description\":\"**태그**: ${{ steps.version.outputs.tag }}\\n**커밋**: ${{ github.sha }}\",\"color\":3066993}]}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
